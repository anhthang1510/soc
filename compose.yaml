services:
  ai:
    build: .
    command: ["ai"]
    environment:
      SOC_AI_TOKEN: ${SOC_AI_TOKEN:-demo-ai-token}
    ports: ["127.0.0.1:8001:8001"]
    restart: unless-stopped
  firewall:
    build: .
    command: ["firewall"]
    environment:
      SOC_FIREWALL_TOKEN: ${SOC_FIREWALL_TOKEN:-demo-firewall-token}
    ports: ["127.0.0.1:8002:8002"]
    volumes:
      - firewall-data:/app/data
      - ./config/policy.json:/app/config/policy.json:ro
    restart: unless-stopped
  automation:
    build: .
    command: ["automation"]
    environment:
      SOC_AI_URL: http://ai:8001
      SOC_FIREWALL_URL: http://firewall:8002
      SOC_AI_TOKEN: ${SOC_AI_TOKEN:-demo-ai-token}
      SOC_FIREWALL_TOKEN: ${SOC_FIREWALL_TOKEN:-demo-firewall-token}
      SOC_AUTOMATION_TOKEN: ${SOC_AUTOMATION_TOKEN:-demo-automation-token}
      SOC_DRY_RUN: ${SOC_DRY_RUN:-true}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - automation-data:/app/data
      - ./config/policy.json:/app/config/policy.json:ro
    depends_on: [ai, firewall]
    restart: unless-stopped
volumes:
  firewall-data:
  automation-data:
